name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # Integration tests start Postgres 17 with testcontainers (Docker is
      # preinstalled on ubuntu-latest). The ping checker test uses
      # unprivileged ICMP sockets, which Ubuntu allows via ping_group_range.
      - name: test
        run: go test -race -count=1 ./...
